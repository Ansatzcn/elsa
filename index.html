<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elsa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fa;
            font-family: "Times New Roman", serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            padding: 2rem 1.8rem;
            transition: 0.2s;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1e293b;
            letter-spacing: -0.5px;
            border-bottom: 2px solid #e9edf4;
            padding-bottom: 0.6rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #64748b;
            margin-left: auto;
            background: #f1f5f9;
            padding: 0.2rem 1rem;
            border-radius: 40px;
        }
        .cloud-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #475569;
            padding: 0.3rem 1rem;
            background: #f1f5f9;
            border-radius: 40px;
            margin-left: 10px;
        }
        .cloud-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .cloud-status .dot.online {
            background: #22c55e;
        }
        .cloud-status .dot.offline {
            background: #ef4444;
        }
        .cloud-status .dot.syncing {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 1rem;
        }
        .toolbar .left-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .right-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #d1d9e6;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .toolbar .btn-primary-outline {
            background: #1e293b;
            border: 1px solid #1e293b;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-primary-outline:hover {
            background: #0f172a;
        }
        .toolbar .btn-sync {
            background: #2563eb;
            border: 1px solid #2563eb;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-sync:hover {
            background: #1d4ed8;
        }
        .toolbar .btn-sync:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .add-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.6rem 1.5rem;
            margin-bottom: 2.2rem;
            border: 1px solid #e2e8f0;
        }
        .add-section h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #0f172a;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .info-tip {
            font-size: 0.8rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            display: inline-block;
            margin-left: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem 1.2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #475569;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 16px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            transition: 0.2s;
            font-family: inherit;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
            box-shadow: 0 0 0 3px rgba(124, 155, 255, 0.2);
        }
        .type-combo {
            position: relative;
        }
        .type-primary-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 44px;
            gap: 7px;
        }
        .type-primary-row input {
            width: 100%;
        }
        .type-trigger {
            min-height: 44px;
            border: 1px solid #d1d9e6;
            border-radius: 16px;
            background: white;
            color: #475569;
            font-weight: 700;
            cursor: pointer;
        }
        .type-trigger:hover {
            background: #f1f5f9;
        }
        .type-panel {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(44px + 7px);
            z-index: 700;
            max-height: 280px;
            overflow-y: auto;
            padding: 0.55rem;
            border: 1px solid #cbd5e1;
            border-radius: 15px;
            background: white;
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.14);
        }
        .type-panel.hidden {
            display: none;
        }
        .type-option-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 34px;
            gap: 6px;
            align-items: center;
        }
        .type-option-row + .type-option-row {
            margin-top: 4px;
        }
        .type-option {
            width: 100%;
            padding: 0.55rem 0.65rem;
            border: 0;
            border-radius: 10px;
            background: white;
            color: #0f172a;
            text-align: left;
            cursor: pointer;
        }
        .type-option:hover {
            background: #f1f5f9;
        }
        .type-delete {
            width: 34px;
            min-height: 34px;
            border: 0;
            border-radius: 9px;
            background: #fff1f2;
            color: #be123c;
            font-weight: 700;
            cursor: pointer;
        }
        .type-delete:hover {
            background: #ffe4e6;
        }
        .type-empty {
            padding: 0.7rem;
            color: #94a3b8;
            text-align: center;
            font-size: 0.82rem;
        }
        .type-actions {
            margin-top: 0.5rem;
            padding-top: 0.55rem;
            border-top: 1px solid #e2e8f0;
        }
        .type-add-current {
            width: 100%;
            padding: 0.5rem 0.7rem;
            border: 0;
            border-radius: 10px;
            background: #f1f5f9;
            color: #334155;
            font-size: 0.82rem;
            font-weight: 650;
            cursor: pointer;
        }
        .type-add-current:hover {
            background: #e2e8f0;
        }
        .type-add-current:disabled {
            opacity: 0.42;
            cursor: not-allowed;
        }
        .btn-primary {
            grid-column: 1 / -1;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.4rem;
        }
        .btn-primary:hover {
            background: #0f172a;
            transform: scale(0.98);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9edf4;
            margin-top: 0.5rem;
        }
        .word-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .word-table th {
            background: #f1f5f9;
            text-align: left;
            padding: 0.9rem 1.2rem;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 2px solid #d1d9e6;
            white-space: nowrap;
        }
        .word-table th.sortable {
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .word-table th.sortable:hover {
            background: #e2e8f0;
        }
        .word-table th.sortable .sort-icon {
            margin-left: 6px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .word-table td {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid #eef2f6;
            vertical-align: top;
            line-height: 1.5;
        }
        .word-table tbody tr:hover {
            background: #fafcff;
        }
        .word-table tbody tr:last-child td {
            border-bottom: none;
        }
        .word-table .col-word {
            font-weight: 600;
            color: #0f172a;
            white-space: nowrap;
            min-width: 100px;
        }
        .word-table .col-type {
            white-space: nowrap;
            color: #1e3a8a;
            min-width: 80px;
        }
        .word-table .col-action {
            text-align: center;
            white-space: nowrap;
            width: 110px;
        }
        .word-table .action-btn {
            background: none;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.4;
            margin: 0 2px;
        }
        .word-table .action-btn.edit-btn {
            color: #1e3a8a;
            background: #dbeafe;
        }
        .word-table .action-btn.edit-btn:hover {
            background: #bfdbfe;
            transform: scale(1.05);
        }
        .word-table .action-btn.delete-btn {
            color: #991b1b;
            background: #fee2e2;
        }
        .word-table .action-btn.delete-btn:hover {
            background: #fecaca;
            transform: scale(1.05);
        }
        .empty-row td {
            padding: 2.5rem 1rem;
            text-align: center;
            color: #94a3b8;
            font-size: 1rem;
            background: #fafcff;
        }

        .word-list-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 1.8rem 0 0.8rem 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .word-list-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0f172a;
        }
        .word-list-header .badge {
            background: #e9edf4;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #334155;
        }

        /* 回到顶部：固定悬浮在页面右侧中段 */
        .back-to-top {
            position: fixed;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            z-index: 900;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 0.48rem 0.72rem;
            border: 1px solid rgba(148, 163, 184, 0.55);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.82);
            color: #64748b;
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.10);
            font-family: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease,
                        background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .back-to-top.visible {
            opacity: 0.72;
            visibility: visible;
            pointer-events: auto;
        }
        .back-to-top:hover,
        .back-to-top:focus-visible {
            opacity: 1;
            color: #334155;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 7px 22px rgba(15, 23, 42, 0.16);
            outline: none;
        }
        .back-to-top:active {
            transform: translateY(-50%) scale(0.97);
        }

        /* 编辑弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2rem 1.8rem;
            max-width: 520px;
            width: 92%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.25s ease;
        }
        .modal-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.2rem;
        }
        .modal-box .modal-sub {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .modal-box .form-group {
            margin-bottom: 1rem;
        }
        .modal-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .modal-box .form-group input,
        .modal-box .form-group textarea,
        .modal-box .form-group select {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group textarea:focus,
        .modal-box .form-group select:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 1.2rem;
        }
        .modal-actions .btn-modal {
            padding: 0.5rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-actions .btn-modal.cancel {
            background: #f1f5f9;
            color: #334155;
        }
        .modal-actions .btn-modal.cancel:hover {
            background: #e2e8f0;
        }
        .modal-actions .btn-modal.save {
            background: #1e293b;
            color: white;
        }
        .modal-actions .btn-modal.save:hover {
            background: #0f172a;
        }
        .modal-actions .btn-modal.delete {
            background: #fee2e2;
            color: #991b1b;
        }
        .modal-actions .btn-modal.delete:hover {
            background: #fecaca;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Toast 消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 2rem;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            background: #1e293b;
            max-width: 90%;
            text-align: center;
        }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        .toast.info { background: #2563eb; }
        .toast.hidden { display: none; }

        /* 配置弹窗 */
        .config-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding:
                max(12px, env(safe-area-inset-top))
                12px
                max(12px, env(safe-area-inset-bottom));
            z-index: 1000;
            animation: fadeIn 0.25s ease;
        }
        .config-overlay.hidden {
            display: none;
        }
        .config-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2rem 1.8rem;
            max-width: 560px;
            width: 94%;
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-gutter: stable;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.25s ease;
        }
        .config-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .config-box .config-desc {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .config-box .form-group {
            margin-bottom: 1rem;
        }
        .config-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .config-box .form-group input {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .config-box .form-group input:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .config-box .form-group .hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .config-box .form-group .hint a {
            color: #2563eb;
            text-decoration: none;
        }
        .config-box .form-group .hint a:hover {
            text-decoration: underline;
        }
        .config-box .token-save-option {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 8px;
            margin-top: 9px;
            color: #475569;
            font-size: 0.82rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            line-height: 1.5;
            cursor: pointer;
        }
        .config-box .token-save-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            margin: 2px 0 0;
            padding: 0;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .config-actions {
            position: sticky;
            bottom: 0;
            z-index: 2;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin: 1.2rem -0.15rem -0.2rem;
            padding: 0.8rem 0.15rem max(0.2rem, env(safe-area-inset-bottom));
            background: linear-gradient(to bottom, rgba(255,255,255,0.88), white 24%);
            border-top: 1px solid #eef2f6;
        }
        .config-actions .btn-config {
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .config-actions .btn-config.primary {
            background: #1e293b;
            color: white;
        }
        .config-actions .btn-config.primary:hover {
            background: #0f172a;
        }
        .config-actions .btn-config.secondary {
            background: #f1f5f9;
            color: #334155;
        }
        .config-actions .btn-config.secondary:hover {
            background: #e2e8f0;
        }

        @media (max-width: 700px) {
            .container { padding: 1.2rem; }
            .form-grid { grid-template-columns: 1fr; }
            .word-table th, .word-table td {
                padding: 0.6rem 0.8rem;
                font-size: 0.85rem;
            }
            .word-table .col-word { min-width: 70px; }
            .word-table .col-action { width: 80px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar .left-group, .toolbar .right-group { justify-content: center; }
            .cloud-status { margin-left: 0; }
            .config-overlay {
                align-items: flex-start;
                padding:
                    max(8px, env(safe-area-inset-top))
                    8px
                    max(8px, env(safe-area-inset-bottom));
            }
            .config-box {
                width: 100%;
                max-height: calc(100vh - 16px);
                max-height: calc(100dvh - 16px);
                padding: 1.25rem 1rem 1rem;
                border-radius: 20px;
            }
            .config-actions .btn-config {
                flex: 1 1 0;
                min-width: 0;
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
            .back-to-top {
                right: 8px;
                padding: 0.45rem 0.58rem;
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            Elsa

                </label>
                <div class="hint">
                    <a href="https://github.com/settings/tokens" target="_blank" rel="noopener noreferrer">创建 Token</a>
                    （建议使用仅限目标仓库的细粒度 Token，只授予 Contents 读写权限并设置合理有效期；共享设备建议不要勾选“在本设备保存Token”）
                </div>

                <input type="text" id="cfgRepo" placeholder="wordbook">
                <div class="hint">当前仓库名：<strong>wordbook</strong></div>
            </div>
            <div class="form-group">
                <label for="cfgFile">数据文件名</label>
                <input type="text" id="cfgFile" placeholder="wordbook_data.json" value="wordbook_data.json">
            </div>
            <div class="config-actions">
                <button type="button" class="btn-config secondary" id="configCancelBtn">取消</button>

    <!-- Toast 消息 -->
    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function() {
            // ============================================================
            //  配置存储
            // ============================================================
            const CONFIG_KEY = 'github_wordbook_config_v2';
            const STORAGE_KEY = 'wordbook_az_data_v2';
            const SYNC_META_KEY = 'wordbook_az_sync_meta_v1';
            const TOKEN_LOCAL_KEY = 'github_wordbook_token_local_v1';
            const TOKEN_SESSION_KEY = 'github_wordbook_token_session_v1';

            const MAX_ITEMS = 10000;
            const MAX_WORD_LENGTH = 200;
            const MAX_TYPE_LENGTH = 100;
            const MAX_IMPORT_FILE_SIZE = 5 * 1024 * 1024;
            const DEFAULT_TYPES = ['写字', '识字', '课文', 'OPW', 'NCE', 'SHE'];

            // ---------- 全局状态 ----------
            let words = [];
            let typeHistory = [...DEFAULT_TYPES];
            let sortOrder = 'asc';
            let editingIndex = null;
            let isSyncing = false;
            let isLoadingCloud = false;
            let syncPending = false;
            let lastKnownSha = null;
            let localChangeVersion = 0;
            let previousFocusedElement = null;

            let syncMeta = {
                dirty: false,
                baseSha: null,
                remoteKey: ''
            };

            let config = {
                token: '',
                rememberToken: true,
                owner: '',
                repo: '',
                file: 'wordbook_data.json'
            };

            // ---------- DOM 引用 ----------
            const wordInput = document.getElementById('wordInput');
            const typeInput = document.getElementById('typeInput');
            const typeCombo = document.getElementById('typeCombo');
            const typeTrigger = document.getElementById('typeTrigger');
            const typePanel = document.getElementById('typePanel');
            const typeOptions = document.getElementById('typeOptions');
            const typeAddCurrent = document.getElementById('typeAddCurrent');
            const addBtn = document.getElementById('addBtn');
            const tableBody = document.getElementById('tableBody');
            const countDisplay = document.getElementById('countDisplay');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const fileInput = document.getElementById('fileInput');
            const sortWordHead = document.getElementById('sortWordHead');
            const sortIcon = document.getElementById('sortIcon');
            const syncBtn = document.getElementById('syncBtn');
            const lastSyncTime = document.getElementById('lastSyncTime');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const configBtn = document.getElementById('configBtn');
            const backToTopBtn = document.getElementById('backToTopBtn');

            const editModal = document.getElementById('editModal');
            const editWordDisplay = document.getElementById('editWordDisplay');
            const editTypeInput = document.getElementById('editTypeInput');
            const editTypeCombo = document.getElementById('editTypeCombo');
            const editTypeTrigger = document.getElementById('editTypeTrigger');
            const editTypePanel = document.getElementById('editTypePanel');
            const editTypeOptions = document.getElementById('editTypeOptions');
            const editTypeAddCurrent = document.getElementById('editTypeAddCurrent');
            const editDeleteBtn = document.getElementById('editDeleteBtn');
            const editCancelBtn = document.getElementById('editCancelBtn');
            const editSaveBtn = document.getElementById('editSaveBtn');

            const configModal = document.getElementById('configModal');
            const cfgToken = document.getElementById('cfgToken');
            const cfgRememberToken = document.getElementById('cfgRememberToken');
            const cfgOwner = document.getElementById('cfgOwner');
            const cfgRepo = document.getElementById('cfgRepo');
            const cfgFile = document.getElementById('cfgFile');
            const configCancelBtn = document.getElementById('configCancelBtn');
            const configSaveBtn = document.getElementById('configSaveBtn');

            const toast = document.getElementById('toast');
            let toastTimer = null;

            // ---------- 安全存储 ----------
            function safeStorageGet(storage, key) {
                try {
                    return storage.getItem(key);
                } catch (e) {
                    console.warn(`读取存储失败：${key}`, e);
                    return null;
                }
            }

            function safeStorageSet(storage, key, value, showError = false) {
                try {
                    storage.setItem(key, value);
                    return true;
                } catch (e) {
                    console.error(`写入存储失败：${key}`, e);
                    if (showError) {
                        showToast(`本地保存失败：${e.message}`, 'error');
                    }
                    return false;
                }
            }

            function safeStorageRemove(storage, key) {
                try {
                    storage.removeItem(key);
                } catch (e) {
                    console.warn(`删除存储失败：${key}`, e);
                }
            }

            // ---------- 配置管理 ----------
            function loadConfig() {
                const stored = safeStorageGet(localStorage, CONFIG_KEY);
                let parsed = {};

                if (stored) {
                    try {
                        parsed = JSON.parse(stored);
                    } catch (e) {
                        console.warn('GitHub 配置格式无效，已忽略。', e);
                    }
                }

                const legacyToken = typeof parsed.token === 'string' ? parsed.token : '';
                const localToken = safeStorageGet(localStorage, TOKEN_LOCAL_KEY) || '';
                const sessionToken = safeStorageGet(sessionStorage, TOKEN_SESSION_KEY) || '';

                // 兼容旧版本：若旧配置内直接保存过 Token，先迁移到本设备保存槽位。
                if (legacyToken && !localToken) {
                    safeStorageSet(localStorage, TOKEN_LOCAL_KEY, legacyToken);
                }

                const effectiveLocalToken = localToken || legacyToken;
                const rememberToken = typeof parsed.rememberToken === 'boolean'
                    ? parsed.rememberToken
                    : Boolean(effectiveLocalToken);

                config = {
                    token: rememberToken
                        ? (effectiveLocalToken || sessionToken)
                        : sessionToken,
                    rememberToken,
                    owner: typeof parsed.owner === 'string' ? parsed.owner : '',
                    repo: typeof parsed.repo === 'string' ? parsed.repo : '',
                    file: typeof parsed.file === 'string' && parsed.file.trim()
                        ? parsed.file.trim()
                        : 'wordbook_data.json'
                };

                // 清理旧配置对象中的明文 Token，Token 独立存放。
                if (legacyToken || Object.prototype.hasOwnProperty.call(parsed, 'token')) {
                    safeStorageSet(localStorage, CONFIG_KEY, JSON.stringify({
                        rememberToken: config.rememberToken,
                        owner: config.owner,
                        repo: config.repo,
                        file: config.file
                    }));
                }

                cfgToken.value = config.token;
                cfgRememberToken.checked = config.rememberToken;
                cfgOwner.value = config.owner;
                cfgRepo.value = config.repo;
                cfgFile.value = config.file;

                return isConfigValid();
            }

            function saveConfig() {
                config.token = cfgToken.value.trim();
                config.rememberToken = cfgRememberToken.checked;
                config.owner = cfgOwner.value.trim();
                config.repo = cfgRepo.value.trim();
                config.file = cfgFile.value.trim() || 'wordbook_data.json';

                if (config.rememberToken) {
                    if (config.token) {
                        safeStorageSet(localStorage, TOKEN_LOCAL_KEY, config.token, true);
                    } else {
                        safeStorageRemove(localStorage, TOKEN_LOCAL_KEY);
                    }
                    safeStorageRemove(sessionStorage, TOKEN_SESSION_KEY);
                } else {
                    safeStorageRemove(localStorage, TOKEN_LOCAL_KEY);
                    if (config.token) {
                        safeStorageSet(sessionStorage, TOKEN_SESSION_KEY, config.token);
                    } else {
                        safeStorageRemove(sessionStorage, TOKEN_SESSION_KEY);
                    }
                }

                return safeStorageSet(localStorage, CONFIG_KEY, JSON.stringify({
                    rememberToken: config.rememberToken,
                    owner: config.owner,
                    repo: config.repo,
                    file: config.file
                }), true);
            }

            function isConfigValid() {
                return Boolean(config.token && config.owner && config.repo && config.file);
            }

            function getRemoteKey() {
                return `${config.owner}/${config.repo}/${config.file}`;
            }

            function encodeContentPath(path) {
                return path
                    .split('/')
                    .filter(part => part !== '')
                    .map(part => encodeURIComponent(part))
                    .join('/');
            }

            // ---------- GitHub API ----------
            async function githubApi(method, endpoint, body = null) {
                const owner = encodeURIComponent(config.owner);
                const repo = encodeURIComponent(config.repo);
                const url = `https://api.github.com/repos/${owner}/${repo}/${endpoint}`;
                const headers = {
                    'Authorization': `Bearer ${config.token}`,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };
                const options = { method, headers };

                if (body !== null) {
                    headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(body);
                }

                let response;
                try {
                    response = await fetch(url, options);
                } catch (e) {
                    const networkError = new Error(`网络请求失败：${e.message}`);
                    networkError.cause = e;
                    throw networkError;
                }

                const responseText = await response.text();
                let responseData = {};
                if (responseText) {
                    try {
                        responseData = JSON.parse(responseText);
                    } catch (e) {
                        responseData = { message: responseText };
                    }
                }

                if (!response.ok) {
                    const error = new Error(responseData.message || `HTTP ${response.status}`);
                    error.status = response.status;
                    error.details = responseData;
                    throw error;
                }

                return responseData;
            }

            async function getFileInfo() {
                try {
                    return await githubApi('GET', `contents/${encodeContentPath(config.file)}`);
                } catch (e) {
                    if (e.status === 404) {
                        return null;
                    }
                    throw e;
                }
            }

            async function getFileSha() {
                const data = await getFileInfo();
                return data ? data.sha : null;
            }

            // ============================================================
            //  UTF-8 编解码（修复中文乱码）
            // ============================================================
            function utf8ToBase64(str) {
                const encoder = new TextEncoder();
                const data = encoder.encode(str);
                const chunkSize = 0x8000;
                let binary = '';

                for (let i = 0; i < data.length; i += chunkSize) {
                    binary += String.fromCharCode(...data.subarray(i, i + chunkSize));
                }

                return btoa(binary);
            }

            function base64ToUtf8(base64) {
                const normalized = String(base64 || '').replace(/\s/g, '');
                const binaryString = atob(normalized);
                const bytes = new Uint8Array(binaryString.length);

                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
            }

            function normalizeItem(item) {
                if (!item || typeof item !== 'object' || typeof item.word !== 'string') {
                    return null;
                }

                const word = item.word.trim().slice(0, MAX_WORD_LENGTH);
                if (!word) {
                    return null;
                }

                return {
                    word,
                    type: typeof item.type === 'string' ? item.type.trim().slice(0, MAX_TYPE_LENGTH) : ''
                };
            }

            function normalizeWords(items) {
                if (!Array.isArray(items)) {
                    return [];
                }

                return items
                    .slice(0, MAX_ITEMS)
                    .map(normalizeItem)
                    .filter(Boolean);
            }

            function normalizeTypeHistory(values) {
                const result = [];
                const seen = new Set();

                (Array.isArray(values) ? values : []).forEach(raw => {
                    const value = typeof raw === 'string'
                        ? raw.trim().slice(0, MAX_TYPE_LENGTH)
                        : '';
                    const key = value.toLocaleLowerCase('zh-CN');

                    if (value && !seen.has(key)) {
                        seen.add(key);
                        result.push(value);
                    }
                });

                return result;
            }

            function mergeTypeHistory(...lists) {
                return normalizeTypeHistory(lists.flat());
            }

            function normalizeDataPayload(payload) {
                // 兼容旧版：旧数据根节点是数组。
                if (Array.isArray(payload)) {
                    const legacyWords = normalizeWords(payload);
                    return {
                        words: legacyWords,
                        types: mergeTypeHistory(
                            DEFAULT_TYPES,
                            legacyWords.map(item => item.type)
                        )
                    };
                }

                if (!payload || typeof payload !== 'object') {
                    return {
                        words: [],
                        types: [...DEFAULT_TYPES]
                    };
                }

                const normalizedWords = normalizeWords(payload.words);
                const hasExplicitTypes = Array.isArray(payload.types);

                return {
                    words: normalizedWords,
                    types: hasExplicitTypes
                        ? normalizeTypeHistory(payload.types)
                        : mergeTypeHistory(
                            DEFAULT_TYPES,
                            normalizedWords.map(item => item.type)
                        )
                };
            }

            function createDataSnapshot() {
                return {
                    schemaVersion: 2,
                    types: normalizeTypeHistory(typeHistory),
                    words: normalizeWords(words)
                };
            }

            async function loadFromGitHub() {
                if (!isConfigValid()) {
                    throw new Error('请先配置 GitHub 连接');
                }

                const data = await getFileInfo();
                if (data === null) {
                    return null;
                }
                if (data.type !== 'file' || typeof data.content !== 'string') {
                    throw new Error('云端路径不是可读取的数据文件');
                }

                let parsed;
                try {
                    parsed = JSON.parse(base64ToUtf8(data.content));
                } catch (e) {
                    throw new Error(`云端数据文件格式错误：${e.message}`);
                }

                const normalized = normalizeDataPayload(parsed);

                return {
                    words: normalized.words,
                    types: normalized.types,
                    sha: data.sha
                };
            }

            function createUploadBody(snapshot, sha) {
                const body = {
                    message: `更新单词数据 - ${new Date().toLocaleString()}`,
                    content: utf8ToBase64(JSON.stringify(snapshot, null, 2))
                };

                if (sha) {
                    body.sha = sha;
                }

                return body;
            }

            async function uploadSnapshot(snapshot, sha) {
                return githubApi(
                    'PUT',
                    `contents/${encodeContentPath(config.file)}`,
                    createUploadBody(snapshot, sha)
                );
            }

            function finishSuccessfulSync(result, snapshotVersion, snapshotLength, showToastMsg) {
                const newSha = result && result.content && result.content.sha
                    ? result.content.sha
                    : lastKnownSha;

                lastKnownSha = newSha;
                syncMeta.baseSha = newSha;
                syncMeta.remoteKey = getRemoteKey();
                syncMeta.dirty = localChangeVersion !== snapshotVersion;
                saveSyncMeta();

                const now = new Date();
                lastSyncTime.textContent = `已同步 ${now.toLocaleString()}`;
                if (showToastMsg) {
                    showToast(`成功同步 ${snapshotLength} 个条目到 GitHub`, 'success');
                }
                setCloudStatus('online', '已连接');
            }

            // ---------- 同步函数 ----------
            async function syncToCloud(showToastMsg = true) {
                if (!isConfigValid()) {
                    showToast('请先点击 "配置" 按钮设置 GitHub 连接', 'error');
                    return;
                }
                if (isLoadingCloud) {
                    showToast('正在读取云端数据，请稍后再同步', 'info');
                    return;
                }
                if (isSyncing) {
                    syncPending = true;
                    return;
                }

                isSyncing = true;
                syncBtn.disabled = true;
                setCloudStatus('syncing', '同步中...');

                const snapshot = createDataSnapshot();
                const snapshotVersion = localChangeVersion;
                let shouldRetryPending = true;

                try {
                    let result;
                    try {
                        result = await uploadSnapshot(snapshot, lastKnownSha);
                    } catch (e) {
                        const isConflict = e.status === 409 || e.status === 422;
                        if (!isConflict) {
                            throw e;
                        }

                        shouldRetryPending = false;
                        syncMeta.dirty = true;
                        saveSyncMeta();
                        setCloudStatus('offline', '存在冲突');

                        if (!showToastMsg) {
                            throw new Error('云端数据已被其他设备修改，请点击“同步”处理冲突');
                        }

                        const overwrite = confirm(
                            '检测到云端数据已被其他设备修改。\n\n' +
                            '点击“确定”将使用当前本地数据覆盖云端；\n' +
                            '点击“取消”将保留本地数据且不覆盖云端。\n\n' +
                            '建议在覆盖前先导出本地备份。'
                        );

                        if (!overwrite) {
                            showToast('已取消覆盖；本地数据仍保留，请先导出备份或重新加载云端数据', 'info');
                            return;
                        }

                        const latestSha = await getFileSha();
                        result = await uploadSnapshot(snapshot, latestSha);
                        shouldRetryPending = true;
                    }

                    finishSuccessfulSync(result, snapshotVersion, snapshot.words.length, showToastMsg);
                } catch (e) {
                    console.error('同步失败:', e);
                    showToast(`同步失败：${e.message}`, 'error');
                    if (statusText.textContent !== '存在冲突') {
                        setCloudStatus('offline', '同步失败');
                    }
                } finally {
                    isSyncing = false;
                    syncBtn.disabled = isLoadingCloud;

                    if (syncPending && shouldRetryPending) {
                        syncPending = false;
                        setTimeout(() => syncToCloud(false), 0);
                    } else if (!shouldRetryPending) {
                        syncPending = false;
                    }
                }
            }

            async function loadFromCloud() {
                if (!isConfigValid()) {
                    setCloudStatus('offline', '未配置');
                    return;
                }
                if (isLoadingCloud) {
                    return;
                }

                isLoadingCloud = true;
                syncBtn.disabled = true;
                setCloudStatus('syncing', '加载中...');

                try {
                    const data = await loadFromGitHub();
                    const currentRemoteKey = getRemoteKey();

                    if (data !== null) {
                        const sameRemote = !syncMeta.remoteKey || syncMeta.remoteKey === currentRemoteKey;
                        const remoteUnchangedSinceLocalEdit = sameRemote &&
                            syncMeta.dirty &&
                            syncMeta.baseSha &&
                            syncMeta.baseSha === data.sha;

                        if (syncMeta.dirty && !remoteUnchangedSinceLocalEdit) {
                            lastKnownSha = syncMeta.baseSha || null;
                            setCloudStatus('offline', '存在冲突');
                            showToast('检测到本地未同步数据与云端版本不同，已保留本地数据，请导出备份后手动同步', 'error');
                            return;
                        }

                        lastKnownSha = data.sha;

                        if (remoteUnchangedSinceLocalEdit) {
                            syncMeta.remoteKey = currentRemoteKey;
                            saveSyncMeta();
                            setCloudStatus('online', '已连接');
                            setTimeout(() => syncToCloud(false), 0);
                            return;
                        }

                        words = data.words;
                        typeHistory = data.types;
                        syncMeta = {
                            dirty: false,
                            baseSha: data.sha,
                            remoteKey: currentRemoteKey
                        };
                        applySortAndRender();
                        renderTypeCombos();
                        saveSyncMeta();

                        const now = new Date();
                        lastSyncTime.textContent = `已同步 ${now.toLocaleString()}`;
                        setCloudStatus('online', '已连接');
                        showToast(`从 GitHub 加载了 ${words.length} 个条目`, 'success');
                    } else {
                        lastKnownSha = null;
                        syncMeta.baseSha = null;
                        syncMeta.remoteKey = currentRemoteKey;
                        setCloudStatus('online', '已连接');
                        saveSyncMeta();

                        if (words.length > 0 || syncMeta.dirty) {
                            showToast('云端无数据，正在上传本地数据', 'info');
                            setTimeout(() => syncToCloud(false), 0);
                        } else {
                            showToast('云端无数据', 'info');
                        }
                    }
                } catch (e) {
                    console.error('加载云端数据失败:', e);
                    showToast(`加载云端失败：${e.message}，已保留本地数据`, 'error');
                    setCloudStatus('offline', '加载失败');
                } finally {
                    isLoadingCloud = false;
                    syncBtn.disabled = isSyncing;
                }
            }

            // ---------- 本地存储 ----------
            function loadSyncMeta() {
                const stored = safeStorageGet(localStorage, SYNC_META_KEY);
                if (!stored) {
                    return;
                }

                try {
                    const parsed = JSON.parse(stored);
                    syncMeta = {
                        dirty: Boolean(parsed.dirty),
                        baseSha: typeof parsed.baseSha === 'string' ? parsed.baseSha : null,
                        remoteKey: typeof parsed.remoteKey === 'string' ? parsed.remoteKey : ''
                    };
                } catch (e) {
                    console.warn('同步元数据格式无效，已重置。', e);
                }
            }

            function saveSyncMeta() {
                safeStorageSet(localStorage, SYNC_META_KEY, JSON.stringify(syncMeta));
            }

            function loadFromLocal() {
                const stored = safeStorageGet(localStorage, STORAGE_KEY);
                if (stored) {
                    try {
                        const normalized = normalizeDataPayload(JSON.parse(stored));
                        words = normalized.words;
                        typeHistory = normalized.types;
                    } catch (e) {
                        console.warn('本地数据格式无效，已使用空列表。', e);
                        words = [];
                        typeHistory = [...DEFAULT_TYPES];
                    }
                } else {
                    words = [];
                    typeHistory = [...DEFAULT_TYPES];
                }
                applySortAndRender();
                renderTypeCombos();
            }

            function saveToLocal() {
                return safeStorageSet(localStorage, STORAGE_KEY, JSON.stringify(createDataSnapshot()), true);
            }

            function markLocalDirty() {
                localChangeVersion += 1;
                syncMeta.dirty = true;
                syncMeta.baseSha = lastKnownSha;
                syncMeta.remoteKey = isConfigValid() ? getRemoteKey() : syncMeta.remoteKey;
                saveSyncMeta();
            }

            // ---------- 类型下拉 ----------
            function getTypeContext(which) {
                const isAdd = which === 'add';
                return {
                    input: isAdd ? typeInput : editTypeInput,
                    panel: isAdd ? typePanel : editTypePanel,
                    trigger: isAdd ? typeTrigger : editTypeTrigger,
                    options: isAdd ? typeOptions : editTypeOptions,
                    addCurrent: isAdd ? typeAddCurrent : editTypeAddCurrent
                };
            }

            function setTypePanelOpen(which, open) {
                const ctx = getTypeContext(which);
                ctx.panel.classList.toggle('hidden', !open);
                ctx.trigger.setAttribute('aria-expanded', String(open));
            }

            function closeTypePanels() {
                setTypePanelOpen('add', false);
                setTypePanelOpen('edit', false);
            }

            function renderTypeCombo(which) {
                const ctx = getTypeContext(which);
                const current = ctx.input.value.trim();
                const currentKey = current.toLocaleLowerCase('zh-CN');

                const visibleTypes = normalizeTypeHistory(typeHistory).filter(value =>
                    value.toLocaleLowerCase('zh-CN') !== currentKey
                );

                ctx.options.innerHTML = visibleTypes.length
                    ? visibleTypes.map(value => `
                        <div class="type-option-row">
                            <button type="button" class="type-option" data-value="${escapeAttribute(value)}">${escapeHtml(value)}</button>
                            <button type="button" class="type-delete" data-value="${escapeAttribute(value)}" title="从类型菜单删除">×</button>
                        </div>
                    `).join('')
                    : '<div class="type-empty">暂无其它类型，可直接输入后按 Enter 添加</div>';

                const alreadyExists = typeHistory.some(value =>
                    value.toLocaleLowerCase('zh-CN') === currentKey
                );
                ctx.addCurrent.disabled = !current || alreadyExists;
            }

            function renderTypeCombos() {
                renderTypeCombo('add');
                renderTypeCombo('edit');
            }

            function escapeAttribute(text) {
                return escapeHtml(text)
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function persistTypeHistoryChange() {
                markLocalDirty();
                saveToLocal();
                renderTypeCombos();

                if (isConfigValid()) {
                    syncToCloud(false);
                }
            }

            function commitType(which, value = null) {
                const ctx = getTypeContext(which);
                const next = String(value === null ? ctx.input.value : value)
                    .trim()
                    .slice(0, MAX_TYPE_LENGTH);

                if (!next) {
                    return false;
                }

                ctx.input.value = next;

                if (!typeHistory.some(item =>
                    item.toLocaleLowerCase('zh-CN') === next.toLocaleLowerCase('zh-CN')
                )) {
                    typeHistory = normalizeTypeHistory([...typeHistory, next]);
                    persistTypeHistoryChange();
                    showToast(`已添加类型“${next}”`, 'success');
                } else {
                    renderTypeCombos();
                }

                setTypePanelOpen(which, false);
                ctx.input.focus();
                return true;
            }

            function deleteTypeFromHistory(value) {
                const target = String(value || '').trim();
                if (!target) {
                    return;
                }

                if (!confirm(`确定从类型下拉菜单中删除“${target}”吗？\n\n已有词汇中的类型不会被删除。`)) {
                    return;
                }

                typeHistory = typeHistory.filter(item =>
                    item.toLocaleLowerCase('zh-CN') !== target.toLocaleLowerCase('zh-CN')
                );
                persistTypeHistoryChange();
                showToast(`已从类型菜单删除“${target}”`, 'success');
            }

            // ---------- 核心函数 ----------
            // 显式使用拼音校对规则：中文按拼音首字母及后续拼音排序。
            // numeric: true 使 word2 排在 word10 前；ignorePunctuation 减少标点对主排序的干扰。
            const pinyinCollator = new Intl.Collator('zh-CN-u-co-pinyin', {
                usage: 'sort',
                sensitivity: 'base',
                numeric: true,
                ignorePunctuation: true
            });
            const generalCollator = new Intl.Collator('zh-CN', {
                usage: 'sort',
                sensitivity: 'base',
                numeric: true,
                ignorePunctuation: true
            });
            const strokeCollator = new Intl.Collator('zh-CN-u-co-stroke', {
                usage: 'sort',
                sensitivity: 'variant',
                numeric: true
            });

            function normalizeSortText(value) {
                return typeof value === 'string'
                    ? value.normalize('NFKC').trim()
                    : '';
            }

            function startsWithChinese(text) {
                const firstCharacter = Array.from(text)[0] || '';
                return /^\p{Script=Han}$/u.test(firstCharacter);
            }

            function compareWordText(wordA, wordB) {
                const textA = normalizeSortText(wordA);
                const textB = normalizeSortText(wordB);

                if (textA === textB) return 0;
                if (!textA) return 1;
                if (!textB) return -1;

                const bothStartWithChinese = startsWithChinese(textA) && startsWithChinese(textB);
                let result = bothStartWithChinese
                    ? pinyinCollator.compare(textA, textB)
                    : generalCollator.compare(textA, textB);

                // 同音、大小写或全角/半角等在主比较中相等时，按笔画及原字符回退，
                // 保证每次渲染和重新加载后的顺序一致。
                if (result === 0) {
                    result = strokeCollator.compare(textA, textB);
                }
                if (result === 0) {
                    result = textA < textB ? -1 : 1;
                }

                return result;
            }

            function sortWords(order) {
                const direction = order || sortOrder;
                const multiplier = direction === 'asc' ? 1 : -1;

                words.sort((a, b) => {
                    return compareWordText(a && a.word, b && b.word) * multiplier;
                });
            }

            function applySortAndRender() {
                sortWords(sortOrder);
                renderTable();
                updateSortIcon();
                saveToLocal();
            }

            function renderTable() {
                countDisplay.textContent = words.length;

                if (words.length === 0) {
                    tableBody.innerHTML = `<tr class="empty-row"><td colspan="3">词汇列表为空，添加一个新词吧！</td></tr>`;
                    return;
                }

                let html = '';
                words.forEach((item, index) => {
                    const word = escapeHtml(item.word || '');
                    const type = escapeHtml(item.type || '');
                    html += `
                        <tr data-index="${index}">
                            <td class="col-word">${word}</td>
                            <td class="col-type">${type}</td>
                            <td class="col-action">
                                <button type="button" class="action-btn edit-btn" data-index="${index}" title="编辑">编辑</button>
                            </td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = html;

                document.querySelectorAll('#tableBody .edit-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const index = this.getAttribute('data-index');
                        if (index !== null) {
                            const idx = Number.parseInt(index, 10);
                            if (Number.isInteger(idx) && idx >= 0 && idx < words.length) {
                                openEditModal(idx);
                            }
                        }
                    });
                });
            }

            function updateSortIcon() {
                sortIcon.textContent = sortOrder === 'asc' ? '▲' : '▼';
                sortWordHead.setAttribute('aria-sort', sortOrder === 'asc' ? 'ascending' : 'descending');
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = String(text ?? '');
                return div.innerHTML;
            }

            // ---------- 编辑功能 ----------
            function openEditModal(index) {
                editingIndex = index;
                const item = words[index];
                previousFocusedElement = document.activeElement;
                editWordDisplay.textContent = item.word;

                editTypeInput.value = item.type || '';
                renderTypeCombo('edit');
                editModal.classList.remove('hidden');
                setTimeout(() => editTypeInput.focus(), 100);
            }

            function closeEditModal() {
                setTypePanelOpen('edit', false);
                editModal.classList.add('hidden');
                editingIndex = null;
                if (previousFocusedElement instanceof HTMLElement) {
                    previousFocusedElement.focus();
                }
                previousFocusedElement = null;
            }

            function saveEdit() {
                if (editingIndex === null || editingIndex < 0 || editingIndex >= words.length) {
                    alert('编辑出错，请重试。');
                    closeEditModal();
                    return;
                }

                const type = editTypeInput.value.trim().slice(0, MAX_TYPE_LENGTH);

                words[editingIndex].type = type;

                markLocalDirty();
                closeEditModal();
                applySortAndRender();
                if (isConfigValid()) {
                    syncToCloud(false);
                }
            }

            function deleteEditingWord() {
                if (editingIndex === null || editingIndex < 0 || editingIndex >= words.length) {
                    alert('删除出错，请重试。');
                    closeEditModal();
                    return;
                }

                const item = words[editingIndex];
                if (!confirm(`确定要删除 "${item.word}" 吗？`)) {
                    return;
                }

                words.splice(editingIndex, 1);
                markLocalDirty();
                closeEditModal();
                applySortAndRender();

                if (isConfigValid()) {
                    syncToCloud(false);
                }
            }

            // ---------- 添加单词 ----------
            function addWord() {
                const word = wordInput.value.trim().slice(0, MAX_WORD_LENGTH);
                const type = typeInput.value.trim().slice(0, MAX_TYPE_LENGTH);

                if (!word) {
                    alert('请填写“词汇”字段。');
                    wordInput.focus();
                    return;
                }

                words.push({ word, type });
                markLocalDirty();
                applySortAndRender();

                if (isConfigValid()) {
                    syncToCloud(false);
                }

                wordInput.value = '';
                typeInput.value = '';
                closeTypePanels();
                renderTypeCombo('add');
                wordInput.focus();
            }

            // ---------- 排序 ----------
            function toggleSort() {
                sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
                applySortAndRender();
            }

            // ---------- 导出/导入 ----------
            function exportData() {
                if (words.length === 0) {
                    alert('词汇列表为空，没有什么可导出的。');
                    return;
                }
                const jsonStr = JSON.stringify(createDataSnapshot(), null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `wordbook_backup_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 0);
                showToast('导出成功', 'success');
            }

            function importData(file) {
                if (!file) {
                    return;
                }
                if (file.size > MAX_IMPORT_FILE_SIZE) {
                    alert('导入文件过大，请选择不超过 5 MB 的 JSON 文件。');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    let imported;
                    try {
                        imported = JSON.parse(String(e.target.result || ''));
                    } catch (err) {
                        alert('解析文件失败，请确保是有效的 JSON 文件。');
                        return;
                    }

                    const normalizedImport = normalizeDataPayload(imported);
                    const sourceCount = Array.isArray(imported)
                        ? imported.length
                        : (Array.isArray(imported.words) ? imported.words.length : 0);

                    if (sourceCount > MAX_ITEMS) {
                        alert(`文件条目过多，最多允许导入 ${MAX_ITEMS} 个条目。`);
                        return;
                    }

                    const valid = normalizedImport.words;
                    if (valid.length === 0 && sourceCount > 0) {
                        alert('文件中没有找到有效的词汇数据。');
                        return;
                    }
                    if (valid.length !== sourceCount) {
                        const continueImport = confirm(
                            `文件中有 ${sourceCount - valid.length} 个无效条目将被忽略，是否继续？`
                        );
                        if (!continueImport) {
                            return;
                        }
                    }
                    if (words.length > 0) {
                        if (!confirm(`当前有 ${words.length} 个条目，导入将完全替换当前列表。确定继续吗？`)) {
                            return;
                        }
                    }

                    words = valid;
                    typeHistory = normalizedImport.types;
                    markLocalDirty();
                    applySortAndRender();
                    showToast(`成功导入 ${words.length} 个条目`, 'success');
                    if (isConfigValid()) {
                        syncToCloud(false);
                    }
                };
                reader.onerror = function() {
                    alert('读取文件失败，请重新选择文件。');
                };
                reader.readAsText(file, 'utf-8');
            }

            // ---------- Cloud Status ----------
            function setCloudStatus(status, text) {
                statusDot.className = `dot ${status}`;
                statusText.textContent = text;
            }

            // ---------- Toast ----------
            function showToast(message, type = 'info') {
                toast.textContent = message;
                toast.className = `toast ${type}`;
                toast.classList.remove('hidden');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.add('hidden');
                }, 3000);
            }

            // ---------- 配置弹窗 ----------
            function openConfigModal() {
                previousFocusedElement = document.activeElement;
                cfgToken.value = config.token || '';
                cfgRememberToken.checked = config.rememberToken;
                cfgOwner.value = config.owner || '';
                cfgRepo.value = config.repo || '';
                cfgFile.value = config.file || 'wordbook_data.json';
                configModal.classList.remove('hidden');
                setTimeout(() => cfgToken.focus(), 100);
            }

            function closeConfigModal() {
                configModal.classList.add('hidden');
                if (previousFocusedElement instanceof HTMLElement) {
                    previousFocusedElement.focus();
                }
                previousFocusedElement = null;
            }

            function saveConfigAndConnect() {
                const token = cfgToken.value.trim();
                const owner = cfgOwner.value.trim();
                const repo = cfgRepo.value.trim();
                const file = cfgFile.value.trim() || 'wordbook_data.json';

                if (!token) {
                    showToast('请输入 GitHub Token', 'error');
                    cfgToken.focus();
                    return;
                }
                if (!owner) {
                    showToast('请输入仓库所有者', 'error');
                    cfgOwner.focus();
                    return;
                }
                if (!repo) {
                    showToast('请输入仓库名称', 'error');
                    cfgRepo.focus();
                    return;
                }
                if (!file || file.endsWith('/')) {
                    showToast('请输入有效的数据文件名', 'error');
                    cfgFile.focus();
                    return;
                }

                const oldRemoteKey = isConfigValid() ? getRemoteKey() : '';

                config.token = token;
                config.rememberToken = cfgRememberToken.checked;
                config.owner = owner;
                config.repo = repo;
                config.file = file;

                if (!saveConfig()) {
                    return;
                }

                const newRemoteKey = getRemoteKey();
                if (oldRemoteKey && oldRemoteKey !== newRemoteKey) {
                    lastKnownSha = null;
                    syncMeta.baseSha = null;
                    syncMeta.remoteKey = newRemoteKey;
                    syncMeta.dirty = words.length > 0;
                    saveSyncMeta();
                }

                closeConfigModal();
                showToast('配置已保存，正在连接...', 'info');
                loadFromCloud();
            }

            // ---------- 事件绑定 ----------
            addBtn.addEventListener('click', addWord);

            wordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    addWord();
                }
            });

            typeInput.addEventListener('click', function(e) {
                e.stopPropagation();
                setTypePanelOpen('edit', false);
                setTypePanelOpen('add', true);
                renderTypeCombo('add');
            });
            editTypeInput.addEventListener('click', function(e) {
                e.stopPropagation();
                setTypePanelOpen('add', false);
                setTypePanelOpen('edit', true);
                renderTypeCombo('edit');
            });

            typeTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                setTypePanelOpen('edit', false);
                setTypePanelOpen('add', typePanel.classList.contains('hidden'));
                renderTypeCombo('add');
            });
            editTypeTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                setTypePanelOpen('add', false);
                setTypePanelOpen('edit', editTypePanel.classList.contains('hidden'));
                renderTypeCombo('edit');
            });

            typeInput.addEventListener('input', () => renderTypeCombo('add'));
            editTypeInput.addEventListener('input', () => renderTypeCombo('edit'));

            typeInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    e.stopPropagation();
                    commitType('add');
                }
            });
            editTypeInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    e.stopPropagation();
                    commitType('edit');
                }
            });

            typeAddCurrent.addEventListener('click', () => commitType('add'));
            editTypeAddCurrent.addEventListener('click', () => commitType('edit'));

            function handleTypeOptionsClick(which, event) {
                const deleteButton = event.target.closest('.type-delete[data-value]');
                if (deleteButton) {
                    event.stopPropagation();
                    deleteTypeFromHistory(deleteButton.dataset.value);
                    return;
                }

                const optionButton = event.target.closest('.type-option[data-value]');
                if (optionButton) {
                    commitType(which, optionButton.dataset.value);
                }
            }

            typeOptions.addEventListener('click', event => handleTypeOptionsClick('add', event));
            editTypeOptions.addEventListener('click', event => handleTypeOptionsClick('edit', event));

            document.addEventListener('click', function(event) {
                if (!typeCombo.contains(event.target)) {
                    setTypePanelOpen('add', false);
                }
                if (!editTypeCombo.contains(event.target)) {
                    setTypePanelOpen('edit', false);
                }
            });

            exportBtn.addEventListener('click', exportData);
            importBtn.addEventListener('click', function() {
                fileInput.click();
            });
            fileInput.addEventListener('change', function() {
                if (this.files && this.files.length > 0) {
                    importData(this.files[0]);
                    this.value = '';
                }
            });

            sortWordHead.addEventListener('click', toggleSort);
            sortWordHead.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleSort();
                }
            });

            syncBtn.addEventListener('click', function() {
                syncToCloud(true);
            });

            configBtn.addEventListener('click', openConfigModal);
            configCancelBtn.addEventListener('click', closeConfigModal);
            configSaveBtn.addEventListener('click', saveConfigAndConnect);

            configModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeConfigModal();
                }
            });

            editDeleteBtn.addEventListener('click', deleteEditingWord);
            editCancelBtn.addEventListener('click', closeEditModal);
            editSaveBtn.addEventListener('click', saveEdit);
            editModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeEditModal();
                }
            });


            document.querySelectorAll('#configModal input').forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        saveConfigAndConnect();
                    }
                });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key !== 'Escape') {
                    return;
                }
                if (!editTypePanel.classList.contains('hidden') || !typePanel.classList.contains('hidden')) {
                    closeTypePanels();
                } else if (!editModal.classList.contains('hidden')) {
                    closeEditModal();
                } else if (!configModal.classList.contains('hidden')) {
                    closeConfigModal();
                }
            });

            // ---------- 回到顶部 ----------
            function updateBackToTopVisibility() {
                backToTopBtn.classList.toggle('visible', window.scrollY > 240);
            }

            backToTopBtn.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });

            window.addEventListener('scroll', updateBackToTopVisibility, { passive: true });
            updateBackToTopVisibility();

            // ---------- 初始化 ----------
            loadSyncMeta();
            loadConfig();
            loadFromLocal();
            renderTypeCombos();
            loadFromCloud();

            document.querySelector('.add-section').addEventListener('click', function(e) {
                const target = e.target;
                if (!(target instanceof Element)) {
                    return;
                }
                if (!target.closest('input, button')) {
                    wordInput.focus();
                }
            });
        })();
    </script>
</body>
</html>
